name: Deploy Estático a Cloudflare Pages

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Compilar y Desplegar Sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar sitio Astro
        run: pnpm build
        env:
          # Inyecta la API de producción en main, y la de staging para dev u otras ramas de pruebas
          PUBLIC_CONTACT_API_URL: ${{ github.ref_name == 'main' && secrets.PUBLIC_CONTACT_API_URL || secrets.PUBLIC_CONTACT_API_URL_STAGING }}

      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler detectará automáticamente si es main (producción) o dev (staging/preview)
          command: pages deploy dist --project-name=oleomac-eirl
