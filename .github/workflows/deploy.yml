name: Deploy Estático a Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Compilar y Desplegar Sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar sitio Astro
        run: pnpm build
        env:
          # Variable de entorno de compilación para apuntar al Worker independiente en producción.
          # Debe configurarse en los Secrets o variables del repositorio de GitHub.
          PUBLIC_CONTACT_API_URL: ${{ secrets.PUBLIC_CONTACT_API_URL }}

      - name: Desplegar a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=oleomac-eirl
